version: 2

# Weekly, one grouped PR per ecosystem, minor and patch updates only.
# A major update is a planned task, not a Dependabot PR (owner, 2026-11-18): the first run opened 13 major PRs,
# and several were Firebase's own pieces that move only with Firebase.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions-npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /Scripts/seed_questions
    schedule:
      interval: weekly
    groups:
      seed-questions-npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dependabot reads TTB.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved (the Xcode project layout).
  # Only the packages the project names. Firebase's own dependencies (app-check, gtm-session-fetcher, abseil, grpc)
  # move with Firebase, and bumping one alone can break the resolve.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "github.com/firebase/firebase-ios-sdk"
      - dependency-name: "github.com/kean/nuke"
    groups:
      swift-packages:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
