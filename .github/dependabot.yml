version: 2

# Weekly. Minor and patch updates come as one grouped PR per ecosystem; major updates as a second grouped PR,
# so a major never hides behind a small one and never floods the list.
# No `ignore` rule on majors: GitHub's docs do not say an `ignore` leaves security updates alone, and a security
# fix that exists only in a new major must still reach us (owner, 2026-11-18). A closed Dependabot PR is not
# reopened for the same version, so the majors closed on 2026-11-18 stay closed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions-npm:
        update-types: [minor, patch]
      functions-npm-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /Scripts/seed_questions
    schedule:
      interval: weekly
    groups:
      seed-questions-npm:
        update-types: [minor, patch]
      seed-questions-npm-major:
        update-types: [major]

  # Dependabot reads TTB.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved (the Xcode project layout).
  # Only the packages the project names. Firebase's own dependencies (app-check, gtm-session-fetcher, abseil, grpc)
  # move with Firebase, and bumping one alone can break the resolve. Dependabot alerts (Security tab) cover
  # every package in Package.resolved either way.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "github.com/firebase/firebase-ios-sdk"
      - dependency-name: "github.com/kean/nuke"
    groups:
      swift-packages:
        update-types: [minor, patch]
