name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.ios.outputs.ios == 'true' }}
      functions: ${{ github.event_name == 'workflow_dispatch' || steps.functions.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # A skipped job reports as skipped, which a required check accepts as passing.
      # "every" makes the "!" patterns exclude files: a file counts only if it matches all of them.
      - uses: dorny/paths-filter@v3
        id: ios
        with:
          predicate-quantifier: every
          filters: |
            ios:
              - '**'
              - '!Documentation/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'

      - uses: dorny/paths-filter@v3
        id: functions
        with:
          filters: |
            functions:
              - 'functions/**'
              - 'firestore.rules'
              - 'storage.rules'
              - 'firestore.indexes.json'
              - 'firebase.json'
              - '.github/workflows/ci.yml'

  build:
    name: Build app and tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Secrets.xcconfig from the template
        run: cp TTB/Secrets.xcconfig.template TTB/Secrets.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ci-spm
          key: spm-${{ hashFiles('TTB.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # Scheme TTB also compiles the UI test target. The test step reuses these products.
      - name: Build app and test targets
        run: |
          xcodebuild build-for-testing \
            -project TTB.xcodeproj \
            -scheme TTB \
            -destination "id=$SIM_UDID" \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || { grep -E 'error:' build.log | head -50; exit 1; }
          tail -n 3 build.log

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project TTB.xcodeproj \
            -scheme TTB \
            -only-testing:TTBTests \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || { grep -E 'error:|failed|Failing tests' test.log | head -80; exit 1; }
          grep -E 'Executed|Test run with|TEST EXECUTE SUCCEEDED|TEST SUCCEEDED' test.log | tail -n 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      # The archive for TestFlight builds Release for a device. Debug-only code (#if DEBUG) that
      # Release code still calls compiles in the steps above and fails only here.
      # It runs on main only; a pull request skips it.
      - name: Build Release for device
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xcodebuild build \
            -project TTB.xcodeproj \
            -scheme TTB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > release.log 2>&1 || { grep -E 'error:' release.log | head -50; exit 1; }
          tail -n 3 release.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            release.log
          if-no-files-found: ignore

  functions:
    name: Functions and security rules tests
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Security rules tests (emulator)
        run: npx -y firebase-tools@latest emulators:exec --project demo-ttb-rules --only firestore,storage "node --test rules-emulator/securityRules.spec.js"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
