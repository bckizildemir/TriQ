name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.ios.outputs.ios == 'true' }}
      functions: ${{ github.event_name == 'workflow_dispatch' || steps.functions.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A skipped job reports as skipped, which a required check accepts as passing.
      # Markdown under TTB/, Tests/ and TTBUITests/ can join the app as a bundle resource, so only root and Scripts/ Markdown is excluded.
      # "every" makes the "!" patterns exclude files: a file counts only if it matches all of them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: ios
        with:
          predicate-quantifier: every
          filters: |
            ios:
              - '**'
              - '!Documentation/**'
              - '!docs/**'
              - '!*.md'
              - '!Scripts/**/*.md'
              - '!.claude/**'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: functions
        with:
          filters: |
            functions:
              - 'functions/**'
              - 'firestore.rules'
              - 'storage.rules'
              - 'firestore.indexes.json'
              - 'firebase.json'
              - '.github/workflows/ci.yml'

  build:
    name: Build app and tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Create Secrets.xcconfig from the template
        run: cp TTB/Secrets.xcconfig.template TTB/Secrets.xcconfig

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ci-spm
          key: spm-${{ hashFiles('TTB.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        run: |
          Scripts/ci-pick-simulator.sh --self-test
          UDID=$(Scripts/ci-pick-simulator.sh)
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # Scheme TTB also compiles the UI test target. The test step reuses these products.
      - name: Build app and test targets
        run: |
          xcodebuild build-for-testing \
            -project TTB.xcodeproj \
            -scheme TTB \
            -destination "id=$SIM_UDID" \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || { grep -E 'error:' build.log | head -50; exit 1; }
          tail -n 3 build.log

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project TTB.xcodeproj \
            -scheme TTB \
            -only-testing:TTBTests \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || { grep -E 'error:|failed|Failing tests' test.log | head -80; exit 1; }
          grep -E 'Executed|Test run with|TEST EXECUTE SUCCEEDED|TEST SUCCEEDED' test.log | tail -n 5 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

      # The archive for TestFlight builds Release for a device. Debug-only code (#if DEBUG) that
      # Release code still calls compiles in the steps above and fails only here.
      # It runs on main only; a pull request skips it.
      - name: Build Release for device
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xcodebuild build \
            -project TTB.xcodeproj \
            -scheme TTB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ~/Library/Caches/ci-spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > release.log 2>&1 || { grep -E 'error:' release.log | head -50; exit 1; }
          tail -n 3 release.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs
          path: |
            build.log
            test.log
            release.log
          if-no-files-found: ignore

  functions:
    name: Functions and security rules tests
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Security rules and account deletion tests (emulator)
        run: npx -y firebase-tools@15.36.0 emulators:exec --project demo-ttb-rules --only firestore,storage,auth "node --test rules-emulator/securityRules.spec.js rules-emulator/accountDeletion.spec.js"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
