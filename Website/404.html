<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TTB - Sayfa bulunamadi</title>
    <meta name="theme-color" content="#F7F1E8">
    <link rel="icon" href="/assets/launch-logo.png">
    <style>
      :root {
        --paper: #f7f1e8;
        --ink: #202124;
        --muted: #65625d;
        --accent: #326a5f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(520px, 100%);
      }

      img {
        width: 52px;
        height: 52px;
        border-radius: 8px;
      }

      h1 {
        margin: 22px 0 12px;
        font-size: clamp(2.2rem, 12vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 26px;
        padding: 0 18px;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/launch-logo.png" alt="">
      <h1 data-i18n="title">Sayfa bulunamadı.</h1>
      <p data-i18n="body">Aradığın bağlantı taşınmış olabilir. Ana sayfaya dönüp TTB beta isteği gönderebilirsin.</p>
      <a href="/" data-i18n="cta">Ana sayfaya dön</a>
    </main>
    <script>
      const en = navigator.language && navigator.language.toLowerCase().startsWith("en");
      if (en) {
        document.documentElement.lang = "en";
        document.querySelector("[data-i18n='title']").textContent = "Page not found.";
        document.querySelector("[data-i18n='body']").textContent = "The link may have moved. Go back home to request TTB beta access.";
        document.querySelector("[data-i18n='cta']").textContent = "Back to home";
      }
    </script>
  </body>
</html>
